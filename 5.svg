<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#020906"/><stop offset=".48" stop-color="#082217"/><stop offset="1" stop-color="#03110a"/>
  </linearGradient>
  <linearGradient id="green" x2="1">
    <stop stop-color="#42ff88"/><stop offset=".48" stop-color="#d9ffe5"/><stop offset="1" stop-color="#42ff88"/>
  </linearGradient>
  <linearGradient id="card" y2="1">
    <stop stop-color="#123522"/><stop offset="1" stop-color="#06150d"/>
  </linearGradient>
  <linearGradient id="scan">
    <stop stop-color="#55ff93" stop-opacity="0"/>
    <stop offset=".5" stop-color="#dcffe7"/>
    <stop offset="1" stop-color="#55ff93" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#50ff91" stop-opacity=".22"/>
    <stop offset="1" stop-color="#50ff91" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#6cff9b" stroke-opacity=".055"/>
    <circle cx="2" cy="2" r="1" fill="#b9ffd0" opacity=".18"/>
  </pattern>
  <filter id="glowFx" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1664" height="936" fill="url(#bg)"/>
<rect width="1664" height="936" fill="url(#grid)">
  <animateTransform attributeName="transform" type="translate" values="0 0;42 42;0 0" dur="16s" repeatCount="indefinite"/>
</rect>
<ellipse cx="832" cy="430" rx="720" ry="440" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="rx" values="610;760;650;720" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="350;470;390;440" dur="12s" repeatCount="indefinite"/>
</ellipse>
<rect x="22" y="22" width="1620" height="892" rx="20" fill="none" stroke="#5dff98" stroke-opacity=".18">
